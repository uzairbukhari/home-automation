plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def releaseStore = System.getenv('PHOTON_KEYSTORE')

android {
    namespace 'com.uzairbukhari.photon'
    compileSdk 36

    defaultConfig {
        applicationId 'com.uzairbukhari.photon'
        minSdk 29
        targetSdk 36
        // CI release builds pass -PphotonVersionCode=<increasing number>; the app compares it with version.json on the latest GitHub release.
        def code = (project.findProperty('photonVersionCode') ?: '100').toInteger()
        versionCode code
        versionName "2.0.${code}"
    }
    if (releaseStore) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('PHOTON_STORE_PASSWORD')
                keyAlias System.getenv('PHOTON_KEY_ALIAS') ?: 'photon'
                keyPassword System.getenv('PHOTON_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStore) signingConfig signingConfigs.release
        }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

kotlin {
    compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.10.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'com.squareup.okhttp3:okhttp:5.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
