plugins { id 'com.android.application' }
def releaseStore = System.getenv('PHOTON_KEYSTORE')
android {
    namespace 'com.photon.energyhome'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.photon.energyhome'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    if (releaseStore) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('PHOTON_STORE_PASSWORD')
                keyAlias 'photon'
                keyPassword System.getenv('PHOTON_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if(releaseStore) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3' }
