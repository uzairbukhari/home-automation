name: Cloudflare deploy

# Builds the app for Cloudflare Workers (OpenNext) and deploys it with its D1 database. Run it by hand from the
# Actions tab. Until the move is finished it is a dry run of the new setup: the cron trigger is off in
# wrangler.jsonc, so nothing collects data and Vercel stays the live app. See docs/cloudflare-setup.md.
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the GitHub environment named "prod".
# Optional secret WORKER_SECRETS: a JSON object of Worker secrets, e.g. {"SESSION_SECRET":"..."}, set on every deploy.
on:
  workflow_dispatch:

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_SECRETS: ${{ secrets.WORKER_SECRETS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the Cloudflare secrets are there
        run: '[ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the prod environment."; exit 1; }'
      - run: npm ci
      - run: npm run cf:build
      # Creates the D1 database on the first deploy.
      - run: npx wrangler deploy
      - name: Set Worker secrets
        if: env.WORKER_SECRETS != ''
        run: |
          printf '%s' "$WORKER_SECRETS" > "$RUNNER_TEMP/worker-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"
      - name: Apply database migrations
        run: npm run cf:migrate
