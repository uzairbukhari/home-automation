name: Android release

# Builds the signed release APK. The signing key is created once and kept in your private Turso
# database (table app_signing), so every build is signed with the same key and phones can update in
# place. Run it by hand from the Actions tab; the APK is attached to the run as an artifact.
# Needs TURSO_DATABASE_URL and TURSO_AUTH_TOKEN as secrets of the GitHub environment named "prod".
on:
  workflow_dispatch:

jobs:
  release:
    environment: prod
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the signed Android app
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          [ -n "$TURSO_DATABASE_URL" ] && [ -n "$TURSO_AUTH_TOKEN" ] || { echo "::error::Add TURSO_DATABASE_URL and TURSO_AUTH_TOKEN to the 'prod' environment."; exit 1; }
          read_key() { node scripts/turso.mjs query "SELECT keystore, password FROM app_signing WHERE id = 1" | jq -c '.[0] // empty'; }
          row="$(read_key)"
          if [ -z "$row" ]; then
            pw="$(openssl rand -hex 24)"
            echo "::add-mask::$pw"
            keytool -genkeypair -keystore "$RUNNER_TEMP/new.p12" -storetype PKCS12 -alias photon \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$pw" -keypass "$pw" -dname "CN=Photon" 2>/dev/null
            node scripts/turso.mjs exec "INSERT OR IGNORE INTO app_signing (id, keystore, password) VALUES (1, '$(base64 -w0 "$RUNNER_TEMP/new.p12")', '$pw')"
            row="$(read_key)"
          fi
          [ -n "$row" ] || { echo "::error::Could not read or create the app signing key in Turso."; exit 1; }
          echo "$row" | jq -r .keystore | base64 -d > "$RUNNER_TEMP/photon.p12"
          pw="$(echo "$row" | jq -r .password)"
          echo "::add-mask::$pw"
          code=$((100 + RUN_NUMBER))
          (cd android && PHOTON_KEYSTORE="$RUNNER_TEMP/photon.p12" PHOTON_STORE_PASSWORD="$pw" PHOTON_KEY_ALIAS=photon \
            ./gradlew --no-daemon :app:assembleRelease -PphotonVersionCode="$code")
      - uses: actions/upload-artifact@v4
        with:
          name: photon-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
