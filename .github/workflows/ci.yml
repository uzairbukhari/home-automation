name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: file:./ci.db
          SESSION_SECRET: ci-only-session-secret-0000000000000000
          CRON_SECRET: ci-only
          DASHBOARD_PASSWORD_HASH: ci-only
