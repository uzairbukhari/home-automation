name: Deploy

# Deploys main to your own Cloudflare account. The Cloudflare secrets, the Turso secrets and the
# CLOUDFLARE_D1_DATABASE_ID variable live in the GitHub environment named "prod"
# (see docs/cloudflare-setup.md). Data lives in Turso; the D1 binding is only kept so the
# old data can be copied across once and as a fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Check Cloudflare settings
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            [ -n "${!name}" ] || { echo "::error::$name is empty. Add it to the 'prod' environment (docs/cloudflare-setup.md)."; exit 1; }
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Data lives in Turso. Apply the schema, and on the first run copy everything from the old
      # D1 database (including the Android signing key). The copy is skipped once it has finished.
      - name: Prepare the Turso database
        run: |
          set -euo pipefail
          jq -n --arg id "$D1_ID" '{name:"home-dashboard",compatibility_date:"2025-01-01",d1_databases:[{binding:"DB",database_name:"home-dashboard",database_id:$id}]}' > "$RUNNER_TEMP/d1-wrangler.json"
          node scripts/turso.mjs migrate
          if node scripts/turso.mjs query "SELECT name FROM _import_log WHERE name = 'd1'" 2>/dev/null | grep -q '"d1"'; then
            echo "D1 data was already copied to Turso."
          else
            npx wrangler d1 export DB --remote --no-schema --output "$RUNNER_TEMP/d1-export.sql" --config "$RUNNER_TEMP/d1-wrangler.json"
            node scripts/turso.mjs import "$RUNNER_TEMP/d1-export.sql"
          fi
      # The Android app is built and published next to the website at /app/photon.apk.
      # Its signing key is created once and kept in your private Turso database, so every
      # build is signed with the same key and phones can update in place.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the signed Android app
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          read_key() { node scripts/turso.mjs query "SELECT keystore, password FROM app_signing WHERE id = 1" | jq -c '.[0] // empty'; }
          row="$(read_key)"
          if [ -z "$row" ]; then
            # Never mint a new key while an old one still exists in D1: a new key forces everyone to reinstall.
            if npx wrangler d1 execute DB --remote --json --config "$RUNNER_TEMP/d1-wrangler.json" --command "SELECT id FROM app_signing WHERE id = 1" 2>/dev/null | jq -e '.[0].results[0]' > /dev/null; then
              echo "::error::The signing key exists in D1 but not in Turso. Not creating a new one."; exit 1
            fi
            pw="$(openssl rand -hex 24)"
            echo "::add-mask::$pw"
            keytool -genkeypair -keystore "$RUNNER_TEMP/new.p12" -storetype PKCS12 -alias photon \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$pw" -keypass "$pw" -dname "CN=Photon" 2>/dev/null
            node scripts/turso.mjs exec "INSERT OR IGNORE INTO app_signing (id, keystore, password) VALUES (1, '$(base64 -w0 "$RUNNER_TEMP/new.p12")', '$pw')"
            row="$(read_key)"
          fi
          [ -n "$row" ] || { echo "::error::Could not read or create the app signing key in Turso."; exit 1; }
          echo "$row" | jq -r .keystore | base64 -d > "$RUNNER_TEMP/photon.p12"
          pw="$(echo "$row" | jq -r .password)"
          echo "::add-mask::$pw"
          code=$((100 + RUN_NUMBER))
          (cd android && PHOTON_KEYSTORE="$RUNNER_TEMP/photon.p12" PHOTON_STORE_PASSWORD="$pw" PHOTON_KEY_ALIAS=photon \
            ./gradlew --no-daemon :app:assembleRelease -PphotonVersionCode="$code")
          mkdir -p public/app
          cp android/app/build/outputs/apk/release/app-release.apk public/app/photon.apk
          printf '{"versionCode":%s,"versionName":"2.0.%s","apk":"/app/photon.apk"}\n' "$code" "$code" > public/app/version.json
      - run: npm run build
      # The build writes a placeholder database id; point it at the real one and
      # keep the D1 binding for the one-time copy and as a fallback.
      - name: Point build at your D1 database
        run: |
          jq --arg id "$D1_ID" '
            .name = "home-dashboard"
            | .d1_databases[0].database_name = "home-dashboard"
            | .d1_databases[0].database_id = $id
          ' dist/server/wrangler.json > dist/server/wrangler.deploy.json
      # The Worker reads its database address and token from these two secrets.
      - name: Give the Worker its Turso settings
        run: jq -n --arg url "$TURSO_DATABASE_URL" --arg token "$TURSO_AUTH_TOKEN" '{TURSO_DATABASE_URL:$url,TURSO_AUTH_TOKEN:$token}' | npx wrangler secret bulk --config dist/server/wrangler.deploy.json
      - run: npx wrangler deploy --keep-vars --config dist/server/wrangler.deploy.json
