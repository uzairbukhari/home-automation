name: Deploy

# Deploys main to your own Cloudflare account. Does nothing until the repository
# variable CLOUDFLARE_D1_DATABASE_ID is set (see docs/cloudflare-setup.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The build writes a placeholder database id; point it at the real one and
      # tell wrangler where the migrations live (relative to this config file).
      - name: Point build at your D1 database
        run: |
          jq --arg id "$D1_ID" '
            .name = "home-dashboard"
            | .d1_databases[0].database_name = "home-dashboard"
            | .d1_databases[0].database_id = $id
            | .d1_databases[0].migrations_dir = "../../drizzle"
          ' dist/server/wrangler.json > dist/server/wrangler.deploy.json
      - run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.deploy.json
      - run: npx wrangler deploy --config dist/server/wrangler.deploy.json
